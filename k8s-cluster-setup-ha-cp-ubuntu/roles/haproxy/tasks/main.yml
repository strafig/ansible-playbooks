---
# Install and configure HAProxy for kube-apiserver load balancing

- name: Install HAProxy
  ansible.builtin.apt:
    name:
      - haproxy
    state: present
  notify: Restart HAProxy

- name: Create HAProxy configuration directory
  ansible.builtin.file:
    path: /etc/haproxy
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: "haproxy -c -f %s"
  notify: Restart HAProxy

- name: Enable and start HAProxy service
  ansible.builtin.systemd:
    name: haproxy
    state: started
    enabled: true
    daemon_reload: true

- name: Verify HAProxy is running
  ansible.builtin.systemd:
    name: haproxy
  register: haproxy_service
  failed_when: haproxy_service.status.ActiveState != "active"
