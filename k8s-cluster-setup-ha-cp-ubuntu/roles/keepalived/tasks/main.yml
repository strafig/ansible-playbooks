---
# Install and configure keepalived for VIP management

- name: Install keepalived
  ansible.builtin.apt:
    name:
      - keepalived
    state: present
  notify: Restart keepalived

- name: Calculate keepalived priority for this node
  ansible.builtin.set_fact:
    keepalived_priority: "{{ 101 - groups['masters'].index(inventory_hostname) }}"

- name: Deploy keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart keepalived

- name: Enable and start keepalived service
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true
    daemon_reload: true

- name: Verify keepalived is running
  ansible.builtin.systemd:
    name: keepalived
  register: keepalived_service
  failed_when: keepalived_service.status.ActiveState != "active"
