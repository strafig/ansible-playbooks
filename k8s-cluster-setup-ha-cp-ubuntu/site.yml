---
# Kubernetes HA Cluster Installation Playbook
# Installs Kubernetes HA cluster on Ubuntu using kubeadm
# with HAProxy + keepalived for control plane high availability
#
# Usage:
#   ansible-playbook -i inventory.ini site.yml
#   ansible-playbook -i inventory.ini site.yml -e ansible_user=myuser

- name: Prepare all nodes for Kubernetes
  hosts: all
  become: true
  roles:
    - common
    - containerd
    - kubernetes

- name: Deploy HA load balancer and VIP on control plane nodes
  hosts: masters
  become: true
  roles:
    - haproxy
    - keepalived

