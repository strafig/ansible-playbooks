---
# Kubernetes HA cluster verification playbook
# Usage: ansible-playbook -i inventory.ini verify.yml

- name: Verify Kubernetes HA cluster health
  hosts: masters[0]
  become: true
  gather_facts: true
  tasks:
    - name: Check all nodes are Ready
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes_status
      environment:
        KUBECONFIG: "{{ cluster_initialized_marker }}"
      changed_when: false

    - name: Display nodes status
      ansible.builtin.debug:
        msg: "{{ nodes_status.stdout_lines }}"

    - name: Verify expected node count
      ansible.builtin.assert:
        that:
          - nodes_status.stdout_lines | length == groups['all'] | length + 1
        fail_msg: "Expected {{ groups['all'] | length }} nodes, but got different count"
        success_msg: "All {{ groups['all'] | length }} nodes are registered"

    - name: Check for NotReady nodes
      ansible.builtin.assert:
        that:
          - "'NotReady' not in nodes_status.stdout"
        fail_msg: "Some nodes are in NotReady state"
        success_msg: "All nodes are in Ready state"

    - name: Verify control plane node count
      ansible.builtin.command: >
        kubectl get nodes -l node-role.kubernetes.io/control-plane --no-headers
      register: cp_nodes
      environment:
        KUBECONFIG: "{{ cluster_initialized_marker }}"
      changed_when: false

    - name: Assert correct number of control plane nodes
      ansible.builtin.assert:
        that:
          - cp_nodes.stdout_lines | length == groups['masters'] | length
        fail_msg: "Expected {{ groups['masters'] | length }} control plane nodes, got {{ cp_nodes.stdout_lines | length }}"
        success_msg: "All {{ groups['masters'] | length }} control plane nodes registered"

    - name: Display control plane nodes
      ansible.builtin.debug:
        msg: "{{ cp_nodes.stdout_lines }}"

    - name: Check kube-system pods
      ansible.builtin.command: kubectl get pods -n kube-system -o wide
      register: system_pods
      environment:
        KUBECONFIG: "{{ cluster_initialized_marker }}"
      changed_when: false

    - name: Display kube-system pods
      ansible.builtin.debug:
        msg: "{{ system_pods.stdout_lines }}"

    - name: Check CoreDNS deployment
      ansible.builtin.command: kubectl get deployment coredns -n kube-system
      register: coredns_status
      environment:
        KUBECONFIG: "{{ cluster_initialized_marker }}"
      changed_when: false

    - name: Display CoreDNS status
      ansible.builtin.debug:
        msg: "{{ coredns_status.stdout_lines }}"

    - name: Check Calico pods
      ansible.builtin.command: kubectl get pods -n kube-system -l k8s-app=calico-node
      register: calico_status
      environment:
        KUBECONFIG: "{{ cluster_initialized_marker }}"
      changed_when: false

    - name: Display Calico status
      ansible.builtin.debug:
        msg: "{{ calico_status.stdout_lines }}"

    - name: Verify etcd cluster members
      ansible.builtin.command: >
        kubectl get pods -n kube-system -l component=etcd --no-headers
      register: etcd_pods
      environment:
        KUBECONFIG: "{{ cluster_initialized_marker }}"
      changed_when: false

    - name: Assert correct number of etcd members
      ansible.builtin.assert:
        that:
          - etcd_pods.stdout_lines | length == groups['masters'] | length
        fail_msg: "Expected {{ groups['masters'] | length }} etcd members, got {{ etcd_pods.stdout_lines | length }}"
        success_msg: "All {{ groups['masters'] | length }} etcd members running"

    - name: Display etcd pods
      ansible.builtin.debug:
        msg: "{{ etcd_pods.stdout_lines }}"

    - name: Check cluster info
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      environment:
        KUBECONFIG: "{{ cluster_initialized_marker }}"
      changed_when: false

    - name: Display cluster info
      ansible.builtin.debug:
        msg: "{{ cluster_info.stdout_lines }}"

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Kubernetes HA cluster verification complete!"
          - "=========================================="
          - "Total Nodes: {{ groups['all'] | length }}"
          - "Control Plane: {{ groups['masters'] | length }} ({{ groups['masters'] | join(', ') }})"
          - "Workers: {{ groups['workers'] | length }} ({{ groups['workers'] | join(', ') }})"
          - "VIP: {{ ha_cluster_vip }}:{{ haproxy_port }}"
          - "=========================================="

- name: Verify HA services on control plane nodes
  hosts: masters
  become: true
  gather_facts: false
  tasks:
    - name: Check HAProxy service status
      ansible.builtin.systemd:
        name: haproxy
      register: haproxy_status
      failed_when: haproxy_status.status.ActiveState != "active"

    - name: Display HAProxy status
      ansible.builtin.debug:
        msg: "HAProxy on {{ inventory_hostname }}: {{ haproxy_status.status.ActiveState }}"

    - name: Check keepalived service status
      ansible.builtin.systemd:
        name: keepalived
      register: keepalived_status
      failed_when: keepalived_status.status.ActiveState != "active"

    - name: Display keepalived status
      ansible.builtin.debug:
        msg: "keepalived on {{ inventory_hostname }}: {{ keepalived_status.status.ActiveState }}"

    - name: Check if VIP is assigned to this node
      ansible.builtin.command: "ip addr show {{ keepalived_vrrp_interface }}"
      register: vip_check
      changed_when: false

    - name: Display VIP assignment
      ansible.builtin.debug:
        msg: >-
          VIP {{ ha_cluster_vip }} is
          {{ 'ASSIGNED' if ha_cluster_vip in vip_check.stdout else 'not assigned' }}
          on {{ inventory_hostname }}
