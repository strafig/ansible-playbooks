---
# Initialize Kubernetes control plane using kubeadm

- name: Check if cluster is already initialized
  ansible.builtin.stat:
    path: "{{ cluster_initialized_marker }}"
  register: kubeadm_init_check

- name: Pull kubeadm container images
  ansible.builtin.command: kubeadm config images pull
  when: not kubeadm_init_check.stat.exists
  changed_when: true

- name: Generate kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /tmp/kubeadm-config.yaml
    owner: root
    group: root
    mode: '0600'
  when: not kubeadm_init_check.stat.exists

- name: Initialize Kubernetes control plane
  ansible.builtin.command: kubeadm init --config /tmp/kubeadm-config.yaml
  register: kubeadm_init
  when: not kubeadm_init_check.stat.exists

- name: Save kubeadm init output
  ansible.builtin.copy:
    content: "{{ kubeadm_init.stdout }}"
    dest: /root/kubeadm-init-output.txt
    owner: root
    group: root
    mode: '0600'
  when: kubeadm_init is changed

- name: Create .kube directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Copy admin.conf to root's .kube directory
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: '0600'

- name: Create .kube directory for ansible user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'
  when: ansible_user != 'root'

- name: Copy admin.conf to ansible user's .kube directory
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
  when: ansible_user != 'root'

- name: Wait for control plane to be ready
  ansible.builtin.command: kubectl get nodes
  register: kubectl_nodes
  until: kubectl_nodes.rc == 0
  retries: 12
  delay: 10
  environment:
    KUBECONFIG: "{{ cluster_initialized_marker }}"
  changed_when: false

- name: Generate join command for worker nodes
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_raw
  changed_when: false

- name: Set join command as fact for worker nodes
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ join_command_raw.stdout }}"
  delegate_facts: true
  delegate_to: "{{ item }}"
  loop: "{{ groups['workers'] | default([]) }}"
