---
# Install Kubernetes packages (kubeadm, kubelet, kubectl)

- name: Set Kubernetes major.minor version for repository
  ansible.builtin.set_fact:
    kubernetes_major_minor: "{{ kubernetes_version.split('.')[:2] | join('.') }}"

- name: Add Kubernetes repository
  community.general.zypper_repository:
    name: kubernetes
    repo: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_major_minor }}/rpm/"
    state: present
    auto_import_keys: true
    autorefresh: true
    enabled: true

- name: Refresh zypper repositories
  community.general.zypper:
    name: '*'
    update_cache: true
  changed_when: false

- name: Install Kubernetes packages
  community.general.zypper:
    name:
      - kubeadm
      - kubelet
      - kubectl
      - kubernetes-cni
      - cri-tools
    state: present
  notify: Restart kubelet

- name: Create kubelet service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/kubelet.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure kubelet to use containerd
  ansible.builtin.copy:
    content: |
      [Service]
      Environment="KUBELET_EXTRA_ARGS=--container-runtime-endpoint=unix://{{ containerd_socket }}"
    dest: /etc/systemd/system/kubelet.service.d/10-containerd.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon
    - Restart kubelet

- name: Enable kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    daemon_reload: true
